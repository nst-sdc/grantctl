# teaching-cluster fixture for the snapshot test (tests/golden.rs)
[admin]        # SSH + sudo everywhere
groups   = instructors,sudo
password = yes

[instructor]
groups   = instructors
password = yes

[user]
groups   = cluster-users
password = yes

[student]
groups   = students
nodes    = node1
password = yes

[gpu]
groups   = gpu-users
nodes    = gpu1
password = yes
from     = control
sshd     = MaxSessions=4,AllowAgentForwarding=no,X11Forwarding=no
home     = /srv/gpu-home
slice    = CPUQuota=800%,MemoryMax=20G,MemoryHigh=16G,TasksMax=1024
quota    = 90G
limits   = nproc=1024,maxlogins=4,core=0

[ops]          # sudo through a role group, on two nodes
groups   = ops
nodes    = node1,node2
sudo     = yes

[lab]          # reachable only from two fixed addresses
groups   = lab-users
nodes    = node3
from     = 10.0.0.5,10.0.0.6
