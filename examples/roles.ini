# Example roles.ini for a teaching cluster:
#   node1 = control / jump host, node2-node3 = workers, gpu1 = shared GPU box
# Copy to /etc/nst-cockpit/roles.ini and adapt. Keys: see "man nst-cockpit".

[admin]        # instructors and operators: SSH + sudo everywhere, password login allowed
groups   = instructors,sudo
password = yes

[instructor]   # SSH everywhere, no sudo
groups   = instructors
password = yes

[user]         # plain shell access; grant per node: user@node3
groups   = cluster-users
password = yes

[student]      # students live on the jump host only
groups   = students
nodes    = node1
password = yes

[gpu]          # GPU box: only reachable from the jump host, with limits
groups   = gpu-users
nodes    = gpu1
password = yes
from     = control
sshd     = MaxSessions=4,AllowAgentForwarding=no,X11Forwarding=no
home     = /srv/gpu-home
slice    = CPUQuota=800%,MemoryMax=20G,MemoryHigh=16G,TasksMax=1024
quota    = 90G
limits   = nproc=1024,maxlogins=4,core=0
