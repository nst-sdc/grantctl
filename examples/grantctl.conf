# grantctl site settings: /etc/grantctl/grantctl.conf
# KEY=VALUE lines. Values may be quoted. Nothing here is executed.

# Name of the control node as written in the nodes file (default: its first line).
CONTROL=node1

# The group the distribution's /etc/sudoers grants full sudo (sudo on Debian/Ubuntu).
SUDO_GROUP=sudo

# Role `init` uses for SSH access it finds outside every other role.
SHELL_ROLE=user

# Files of earlier tooling that grantctl replaces on the first sync.
# They are removed only after grantctl's own files have been validated.
#LEGACY_SSHD="00-lockdown.conf 99-admin-password.conf"     # in /etc/ssh/sshd_config.d
#LEGACY_SUDO="10-admins 90-nopasswd"                       # in /etc/sudoers.d
#LEGACY_LIMITS="90-gpu.conf"                               # in /etc/security/limits.d
#LEGACY_SLICE_MARKER="managed by old-tool"                 # text marking slice drop-ins to take over
#LEGACY_MANAGERS="old-adduser.sh"                          # scripts `audit` should warn about
