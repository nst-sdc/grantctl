# Example /etc/nst-cockpit/cockpit.conf (shell syntax). All settings are optional.
CONTROL=node1                 # control node, as written in the nodes file (default: first line)
SUDO_GROUP=sudo               # distro sudo group (Debian/Ubuntu: sudo)
SHELL_ROLE=user               # role "init" uses for SSH access it finds outside other roles

